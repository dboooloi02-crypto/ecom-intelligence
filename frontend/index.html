<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI跨境研究员</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#d4d0d0;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}.topbar{padding:14px 24px;border-bottom:1px solid rgba(245,232,52,0.08);display:flex;justify-content:space-between;align-items:center}.logo{font-size:14px;font-weight:700;color:#f5e834;letter-spacing:1px;text-transform:uppercase}.logo span{color:rgba(255,255,255,0.2);font-weight:400;font-size:10px;margin-left:8px}.status{font-size:10px;color:rgba(0,240,255,0.3);font-family:JetBrains Mono,monospace}.status .dot{width:5px;height:5px;border-radius:50%;background:#34d399;display:inline-block;margin-right:5px;box-shadow:0 0 6px rgba(52,211,153,0.3)}.chat{flex:1;overflow-y:auto;padding:20px 24px;max-width:800px;margin:0 auto;width:100%}.msg{margin-bottom:20px;animation:fadeIn .3s}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.msg .label{font-size:10px;color:rgba(255,255,255,0.2);margin-bottom:6px;font-family:JetBrains Mono,monospace}.msg .bubble{background:rgba(255,255,255,0.02);border:1px solid rgba(245,232,52,0.06);padding:14px 18px;line-height:1.7;font-size:13px}.msg.user .bubble{border-color:rgba(0,240,255,0.1);background:rgba(0,240,255,0.02)}.msg.report .bubble{border-color:rgba(245,232,52,0.08)}.msg .bubble h2{color:#f5e834;font-size:14px;font-weight:600;margin:16px 0 8px}.msg .bubble h3{color:#d4d0d0;font-size:13px;font-weight:600;margin:10px 0 4px}.msg .bubble p{color:rgba(255,255,255,0.6)}.msg .bubble strong{color:#d4d0d0}.thinking{display:flex;gap:4px;padding:8px 0;align-items:center;color:rgba(255,255,255,0.3);font-size:11px;font-family:JetBrains Mono,monospace}.thinking .dots span{width:4px;height:4px;border-radius:50%;background:#f5e834;display:inline-block;animation:bounce 1.4s infinite}.thinking .dots span:nth-child(2){animation-delay:.2s}.thinking .dots span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{opacity:.3}40%{opacity:1}}.input-wrap{border-top:1px solid rgba(245,232,52,0.06);padding:14px 24px;max-width:800px;margin:0 auto;width:100%}.input-row{display:flex;gap:8px}.input-row input{flex:1;padding:10px 14px;border:1px solid rgba(245,232,52,0.12);background:rgba(5,5,8,0.8);color:#d4d0d0;font-size:13px;font-family:Inter,sans-serif;outline:none}.input-row input:focus{border-color:#f5e834}.input-row input::placeholder{color:rgba(255,255,255,0.15)}.input-row button{padding:10px 24px;border:1px solid rgba(245,232,52,0.2);background:transparent;color:#f5e834;font-size:12px;cursor:pointer;font-family:JetBrains Mono,monospace;transition:all .2s}.input-row button:hover{background:rgba(245,232,52,0.06);border-color:#f5e834}.input-row button:disabled{opacity:.3;cursor:not-allowed}.examples{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.examples button{padding:4px 10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:rgba(255,255,255,0.2);font-size:10px;cursor:pointer;font-family:Inter,sans-serif}</style></head><body><div class="topbar"><div class="logo">AI跨境研究员 <span>v0.1</span></div><div class="status"><span class="dot"></span>API READY</div></div><div class="chat" id="chat"><div class="msg"><div class="label">SYSTEM</div><div class="bubble" style="color:rgba(255,255,255,0.3);font-size:12px">输入一句话，自动研究市场、分析竞品、生成报告。<br>例如：<em>"分析台湾宠物用品市场"</em> 或 <em>"帮我找泰国市场好卖的蓝牙耳机"</em></div></div></div><div class="input-wrap"><div class="input-row"><input id="input" placeholder="输入一句话，开始跨境研究..." autofocus><button id="sendBtn" onclick="send()">研 究</button></div><div class="examples"><button onclick="example(this)">台湾宠物用品</button><button onclick="example(this)">泰国蓝牙耳机</button><button onclick="example(this)">马来西亚美妆</button><button onclick="example(this)">菲律宾夏季服饰</button></div></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn');input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)send()});function example(el){input.value=el.textContent;send()}function addMessage(label,html,cls=''){const div=document.createElement('div');div.className='msg '+cls;div.innerHTML='<div class="label">'+label+'</div><div class="bubble">'+html+'</div>';chat.appendChild(div);chat.scrollTop=chat.scrollHeight}function addThinking(){const div=document.createElement('div');div.className='msg thinking';div.id='thinking';div.innerHTML='研究分析中 <span class="dots"><span></span><span></span><span></span></span>';chat.appendChild(div);chat.scrollTop=chat.scrollHeight}function removeThinking(){const el=document.getElementById('thinking');if(el)el.remove()}function reportToHtml(data){return data.markdown.replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}async function send(){const q=input.value.trim();if(!q)return;addMessage('YOU',q,'user');input.value='';sendBtn.disabled=true;addThinking();try{const res=await fetch('http://localhost:8000/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});const data=await res.json();removeThinking();addMessage('AI研究员',reportToHtml(data),'report')}catch(e){removeThinking();addMessage('ERROR','连接失败: '+e.message+'<br>请确认 API 服务器是否运行在 http://localhost:8000','')}sendBtn.disabled=false}</script></body></html>
